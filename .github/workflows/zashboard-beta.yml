name: Build WebUiBox Zashboard Beta
on:
  pull_request:
    paths: ['next/**', '.github/workflows/zashboard-beta.yml']
  push:
    branches: [main]
    paths: ['next/**', '.github/workflows/zashboard-beta.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WebUiBox custom sources
        uses: actions/checkout@v4
        with:
          path: webuibox
      - name: Checkout pinned upstream Zashboard MIT source
        uses: actions/checkout@v4
        with:
          repository: Zephyruso/zashboard
          ref: e5b48b4e8fe5c727170a57444c969f01aca3fbad
          path: upstream
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.20.0'
      - name: Apply Zashboard source patches
        run: |
          node --check webuibox/next/scripts/patch-upstream.mjs
          node webuibox/next/scripts/patch-upstream.mjs upstream
          node webuibox/next/tests/check.mjs
      - name: Install locked Zashboard dependencies
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: upstream
        run: pnpm type-check
      - name: Build lightweight WebUI
        working-directory: upstream
        run: pnpm build:no-fonts
      - name: Package Android WebUI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/webui
          cp -a upstream/dist/. package/webui/
          cp webuibox/box-status.json package/webui/box-status.json
          cp upstream/LICENSE package/LICENSE-ZASHBOARD
          cp webuibox/next/README_vi.md package/README_vi.md
          cp webuibox/next/scripts/install-android.sh package/install-android.sh
          chmod +x package/install-android.sh
          grep -q WebUiBox package/webui/index.html
          test -s package/webui/index.html
          FILE="webuibox-zashboard-v1.0.0-beta.1.zip"
          (cd package && zip -q -r "../$FILE" .)
          sha256sum "$FILE" > "$FILE.sha256"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: webuibox-zashboard-beta
          path: |
            webuibox-zashboard-v*.zip
            webuibox-zashboard-v*.zip.sha256
      - name: Publish independent prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v1.0.0-beta.1
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Keeping published beta assets."
            exit 0
          fi
          gh release create "$TAG" "$FILE" "$FILE.sha256" \
            --prerelease --target "$GITHUB_SHA" \
            --title "WebUiBox Zashboard v1.0.0 Beta 1" \
            --notes "Pinned Zashboard MIT, original Mihomo functions, WebUiBox Dark Neon, Vietnamese, Box Manager. Read README_vi.md; beta root Box actions remain read-only."
