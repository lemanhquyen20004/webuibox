name: Verify and package WebUiBox
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Test
        run: |
          npm test
          go test ./hotspot
      - name: Compile ARM64 root helper
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o hotspot/webuibox-hotspot-arm64 ./hotspot
          test -s hotspot/webuibox-hotspot-arm64
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          V="$(node -p "require('./package.json').version")"
          FILE="webuibox-v$V.zip"
          zip -q -r "$FILE" index.html styles.css app.js hotspot.js updater-ui.js box-status.json update.json bridge scripts hotspot/webuibox-hotspot-arm64 LICENSE README.md README_vi.md package.json
          sha256sum "$FILE" > "$FILE.sha256"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: webuibox-build
          path: |
            webuibox-v*.zip
            webuibox-v*.zip.sha256
      - name: Publish release once per version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$V"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag/version mismatch"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping published assets unchanged."
            exit 0
          fi
          gh release create "$TAG" "$FILE" "$FILE.sha256" \
            --target "$GITHUB_SHA" \
            --title "WebUiBox $TAG" \
            --notes "WebUiBox $TAG: Persistent Box status on updates: bundle neutral box-status.json, preserve live metrics, restart the status bridge. Hotspot remains beta."
